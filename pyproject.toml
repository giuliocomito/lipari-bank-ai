[project]
name = "lipari-bank-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# le migration le scrive Alembic dal suo modello: si leggono, non si riformattano
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "ANN", "ASYNC", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Body nei default degli endpoint sono l'idioma FastAPI, non un bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Un test non ha chiamanti: il tipo di ritorno non informa nessuno.
"tests/*" = ["ANN001", "ANN201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# dal Giorno 3 un solo event loop per tutta la suite: l'engine è uno per processo, e le
# connessioni del suo pool restano legate al loop che le ha aperte
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
